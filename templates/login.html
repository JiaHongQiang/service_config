{% extends "base.html" %}
{% block title %}登录 - 服务管理工具{% endblock %}

{% block head %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 🎨 统一配色系统 */
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-gradient-1: #eff6ff;
            --bg-gradient-2: #dbeafe;

            /* 🧊 玻璃拟态变量 */
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: 1px solid rgba(255, 255, 255, 0.6);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

            --text-main: #1f2937;
            --text-secondary: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            /* 动态渐变背景 */
            background-color: #f3f4f6;
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 50%),
                radial-gradient(at 0% 0%, hsla(210,100%,96%,1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(220,100%,94%,1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 420px; /* 稍微收窄卡片以显得更精致 */
            padding: 20px;
        }

        /* 🧊 卡片主体优化 */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            border: var(--glass-border);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 头部区域 */
        .login-header {
            padding: 40px 40px 20px 40px;
            text-align: center;
            background: transparent;
        }

        .login-header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* 表单区域 */
        .login-body {
            padding: 10px 40px 40px 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* 输入框优化 */
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(209, 213, 219, 0.8);
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-group input:focus {
            outline: none;
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            transform: translateY(-1px);
        }

        /* 💫 按钮优化 */
        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px -1px rgba(59, 130, 246, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* 底部链接 */
        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            font-size: 13px;
        }

        .form-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .form-footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .d-none {
            display: none;
        }

        /* 🎯 消息提示框 - 悬浮胶囊风 */
        .alert-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: none;
        }

        .alert {
            min-width: 320px;
            padding: 12px 20px;
            border-radius: 50px; /* 胶囊形状 */
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .alert-success {
            background: rgba(236, 253, 245, 0.95);
            color: #059669;
            border-color: rgba(167, 243, 208, 0.5);
        }

        .alert-danger {
            background: rgba(254, 242, 242, 0.95);
            color: #dc2626;
            border-color: rgba(254, 202, 202, 0.5);
        }

        .alert-close {
            background: none;
            border: none;
            color: currentColor;
            cursor: pointer;
            font-size: 18px;
            padding: 0 0 0 12px;
            opacity: 0.6;
            line-height: 1;
        }

        .alert-close:hover { opacity: 1; }
    </style>
{% endblock %}

{% block content %}
    <div class="alert-container">
        <div class="alert alert-success" id="messageAlert">
            <span id="messageText"></span>
            <button class="alert-close" onclick="closeAlert()">✕</button>
        </div>
    </div>

    <div class="container">
        <div class="login-card">
            <div id="loginFormContainer">
                <div class="login-header">
                    <h1>怀业服务管理平台</h1>
                    <p>Login to your account</p>
                </div>
                <div class="login-body">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="password">密码</label>
                            <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn-submit">登 录</button>
                        <div class="form-footer">
<!--                            <a href="#">忘记密码？</a>-->
                            <a href="#" id="showRegister">注册账号</a>
                        </div>
                    </form>
                </div>
            </div>

            <div id="registerFormContainer" class="d-none">
                <div class="login-header">
                    <h1>创建账号</h1>
                    <p>Create new account</p>
                </div>
                <div class="login-body">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="regUsername">用户名</label>
                            <input type="text" id="regUsername" placeholder="设置用户名" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="regPassword">密码</label>
                            <input type="password" id="regPassword" placeholder="设置密码（至少6位）" required autocomplete="new-password">
                        </div>
                        <div class="form-group">
                            <label for="regPasswordConfirm">确认密码</label>
                            <input type="password" id="regPasswordConfirm" placeholder="确认密码" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn-submit">注 册</button>
                        <div class="form-footer">
                            <a href="#" id="showLogin">返回登录</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();

            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                login();
            });

            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                register();
            });

            document.getElementById('showRegister').addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('loginFormContainer').classList.add('d-none');
                document.getElementById('registerFormContainer').classList.remove('d-none');
            });

            document.getElementById('showLogin').addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('registerFormContainer').classList.add('d-none');
                document.getElementById('loginFormContainer').classList.remove('d-none');
            });
        });

        function showMessage(message, type = 'success') {
            const alertContainer = document.querySelector('.alert-container');
            const alert = document.getElementById('messageAlert');
            const messageText = document.getElementById('messageText');

            messageText.textContent = message;
            alert.className = `alert alert-${type}`;
            alertContainer.style.display = 'block';

            setTimeout(() => {
                closeAlert();
            }, 5000);
        }

        function closeAlert() {
            const alertContainer = document.querySelector('.alert-container');
            alertContainer.style.display = 'none';
        }

        async function checkLoginStatus() {
            try {
                const response = await fetch('/auth/status');
                if (response.ok) {
                    const data = await response.json();
                    if (data.logged_in) {
                        window.location.href = '/';
                    }
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✓ 登录成功，正在跳转...');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1200);
                } else {
                    showMessage('✗ 登录失败：' + (data.error || '未知错误'), 'danger');
                }
            } catch (error) {
                console.error('登录请求失败:', error);
                showMessage('✗ 登录请求失败', 'danger');
            }
        }

        async function register() {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;

            if (password !== passwordConfirm) {
                showMessage('✗ 两次输入的密码不一致', 'danger');
                return;
            }

            if (password.length < 6) {
                showMessage('✗ 密码长度至少为 6 位', 'danger');
                return;
            }

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✓ 注册成功，请登录');
                    setTimeout(() => {
                        document.getElementById('registerFormContainer').classList.add('d-none');
                        document.getElementById('loginFormContainer').classList.remove('d-none');
                        document.getElementById('loginForm').reset();
                    }, 1500);
                } else {
                    showMessage('✗ 注册失败：' + (data.error || '未知错误'), 'danger');
                }
            } catch (error) {
                console.error('注册请求失败:', error);
                showMessage('✗ 注册请求失败', 'danger');
            }
        }
    </script>
{% endblock %}
