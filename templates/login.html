<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 服务管理工具</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --tech-blue: #0080ff;
            --tech-purple: #7c3aed;
            --tech-cyan: #00d9ff;
            --tech-dark: #0a1628;
            --tech-light: #e0f4ff;
            --header-height: 70px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #cfe9ff 0%, #e7f6ff 50%, #bde0fe 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 0 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 128, 255, 0.15),
                        0 0 40px rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 128, 255, 0.2);
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        /* 🌟 科技背景光效 */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 128, 255, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 217, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, rgba(0, 128, 255, 0.15) 0%, rgba(0, 217, 255, 0.1) 100%);
            border-bottom: 2px solid rgba(0, 128, 255, 0.3);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 🔷 科技装饰线 */
        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--tech-blue) 25%,
                var(--tech-cyan) 50%,
                var(--tech-blue) 75%,
                transparent 100%);
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--tech-blue) 0%, var(--tech-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            font-size: 13px;
            color: var(--tech-blue);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .login-body {
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--tech-blue);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 14px;
            border: 2px solid rgba(0, 128, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.7);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
            color: var(--tech-dark);
        }

        .form-group input::placeholder {
            color: rgba(0, 128, 255, 0.4);
        }

        .form-group input:focus {
            outline: none;
            background: white;
            border-color: var(--tech-blue);
            box-shadow: 0 0 0 4px rgba(0, 128, 255, 0.1),
                        0 0 20px rgba(0, 128, 255, 0.2),
                        inset 0 0 10px rgba(0, 217, 255, 0.05);
            transform: translateY(-2px);
        }

        /* 💫 按钮科技风格 */
        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--tech-blue) 0%, var(--tech-cyan) 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.2) 50%,
                transparent 100%);
            transition: left 0.5s;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 128, 255, 0.4),
                        0 0 20px var(--tech-cyan);
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 12px;
        }

        .form-footer a {
            color: var(--tech-blue);
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
            position: relative;
        }

        .form-footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--tech-blue), var(--tech-cyan));
            transition: width 0.3s;
        }

        .form-footer a:hover::after {
            width: 100%;
        }

        .d-none {
            display: none;
        }

        /* 🎯 消息提示框 - 科技风 */
        .alert-container {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: none;
            animation: slideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .alert {
            min-width: 340px;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2),
                        0 0 30px rgba(0, 128, 255, 0.2);
            border: 1px solid rgba(0, 128, 255, 0.3);
            backdrop-filter: blur(10px);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(34, 197, 94, 0.05) 100%);
            color: #16a34a;
            border-color: rgba(34, 197, 94, 0.3);
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.1) 0%, rgba(220, 38, 38, 0.05) 100%);
            color: #dc2626;
            border-color: rgba(220, 38, 38, 0.3);
        }

        .alert-close {
            background: none;
            border: none;
            color: currentColor;
            cursor: pointer;
            font-size: 20px;
            padding: 0;
            margin-left: 12px;
            opacity: 0.6;
            transition: all 0.3s;
        }

        .alert-close:hover {
            opacity: 1;
            transform: rotate(90deg);
        }

        /* 📱 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 0 16px;
            }

            .login-body {
                padding: 28px 20px;
            }

            .login-header {
                padding: 28px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .alert {
                min-width: auto;
                max-width: 90vw;
                font-size: 13px;
                padding: 14px 16px;
            }

            .btn-submit {
                padding: 12px;
                font-size: 14px;
            }
        }

        /* ✨ 按钮科技高亮 */
        .btn-outline-primary {
            border-color: var(--tech-blue);
            color: var(--tech-blue);
            transition: 0.3s;
        }

        .btn-outline-primary:hover {
            background: var(--tech-blue);
            color: white;
            box-shadow: 0 0 10px var(--tech-blue);
        }

        .btn-primary, .btn-success, .btn-info, .btn-warning, .btn-danger {
            border: none;
            transition: 0.3s;
        }

        .btn-primary:hover,
        .btn-success:hover,
        .btn-info:hover,
        .btn-warning:hover,
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(0, 128, 255, 0.4);
        }
    </style>
</head>
<body>
    <!-- 消息提示框 -->
    <div class="alert-container">
        <div class="alert alert-success" id="messageAlert">
            <span id="messageText"></span>
            <button class="alert-close" onclick="closeAlert()">✕</button>
        </div>
    </div>

    <div class="container">
        <div class="login-card">
            <!-- 登录表单 -->
            <div id="loginFormContainer">
                <div class="login-header">
                    <h1>服务管理工具</h1>
                    <p>✨ 智能管理平台</p>
                </div>
                <div class="login-body">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" id="username" placeholder="输入您的用户名" required>
                        </div>
                        <div class="form-group">
                            <label for="password">密码</label>
                            <input type="password" id="password" placeholder="输入您的密码" required>
                        </div>
                        <button type="submit" class="btn-submit">立即登录</button>
                        <div class="form-footer">
                            <a href="#">忘记密码？</a>
                            <a href="#" id="showRegister">注册新账户</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 注册表单 -->
            <div id="registerFormContainer" class="d-none">
                <div class="login-header">
                    <h1>创建新账户</h1>
                    <p>🚀 加入我们</p>
                </div>
                <div class="login-body">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="regUsername">用户名</label>
                            <input type="text" id="regUsername" placeholder="输入用户名" required>
                        </div>
                        <div class="form-group">
                            <label for="regPassword">密码</label>
                            <input type="password" id="regPassword" placeholder="输入密码（至少6位）" required>
                        </div>
                        <div class="form-group">
                            <label for="regPasswordConfirm">确认密码</label>
                            <input type="password" id="regPasswordConfirm" placeholder="请再次输入密码" required>
                        </div>
                        <button type="submit" class="btn-submit">立即注册</button>
                        <div class="form-footer">
                            <a href="#" id="showLogin">返回登录</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();

            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                login();
            });

            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                register();
            });

            document.getElementById('showRegister').addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('loginFormContainer').classList.add('d-none');
                document.getElementById('registerFormContainer').classList.remove('d-none');
            });

            document.getElementById('showLogin').addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('registerFormContainer').classList.add('d-none');
                document.getElementById('loginFormContainer').classList.remove('d-none');
            });
        });

        function showMessage(message, type = 'success') {
            const alertContainer = document.querySelector('.alert-container');
            const alert = document.getElementById('messageAlert');
            const messageText = document.getElementById('messageText');

            messageText.textContent = message;
            alert.className = `alert alert-${type}`;
            alertContainer.style.display = 'block';

            setTimeout(() => {
                closeAlert();
            }, 5000);
        }

        function closeAlert() {
            const alertContainer = document.querySelector('.alert-container');
            alertContainer.style.display = 'none';
        }

        async function checkLoginStatus() {
            try {
                const response = await fetch('/auth/status');
                if (response.ok) {
                    const data = await response.json();
                    if (data.logged_in) {
                        window.location.href = '/';
                    }
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✓ 登录成功，正在跳转...');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1200);
                } else {
                    showMessage('✗ 登录失败：' + (data.error || '未知错误'), 'danger');
                }
            } catch (error) {
                console.error('登录请求失败:', error);
                showMessage('✗ 登录请求失败', 'danger');
            }
        }

        async function register() {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;

            if (password !== passwordConfirm) {
                showMessage('✗ 两次输入的密码不一致', 'danger');
                return;
            }

            if (password.length < 6) {
                showMessage('✗ 密码长度至少为 6 位', 'danger');
                return;
            }

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✓ 注册成功，请登录');
                    setTimeout(() => {
                        document.getElementById('registerFormContainer').classList.add('d-none');
                        document.getElementById('loginFormContainer').classList.remove('d-none');
                        document.getElementById('loginForm').reset();
                    }, 1500);
                } else {
                    showMessage('✗ 注册失败：' + (data.error || '未知错误'), 'danger');
                }
            } catch (error) {
                console.error('注册请求失败:', error);
                showMessage('✗ 注册请求失败', 'danger');
            }
        }
    </script>
</body>
</html>
