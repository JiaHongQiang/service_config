    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs/loader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff@5.0.0/dist/diff.min.js"></script>

    <script>
        // --- 辅助工具函数 ---
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        class ToastNotification {
            constructor(title, message, type = 'info', duration = 3000) {
                this.title = title; this.message = message; this.type = type; this.duration = duration;
                this.create();
            }
            create() {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `custom-toast toast-${this.type}`;
                const icons = { success: 'fas fa-check-circle', error: 'fas fa-exclamation-circle', info: 'fas fa-info-circle', warning: 'fas fa-exclamation-triangle' };
                const iconColor = { success: '#10b981', error: '#ef4444', info: '#3b82f6', warning: '#f59e0b' };

                toast.innerHTML = `
                    <div class="toast-icon" style="color:${iconColor[this.type]}"><i class="${icons[this.type]}"></i></div>
                    <div class="toast-content">
                        <div class="toast-title">${escapeHtml(this.title)}</div>
                        <div class="toast-message">${escapeHtml(this.message)}</div>
                    </div>
                    <button class="toast-close"><i class="fas fa-times"></i></button>
                `;
                container.appendChild(toast);
                toast.querySelector('.toast-close').addEventListener('click', () => this.close(toast));
                setTimeout(() => { if (toast.parentNode) this.close(toast); }, this.duration);
            }
            close(toast) {
                toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; toast.style.transition = 'all 0.3s ease';
                setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }
        }
        function showToast(title, message, type = 'info', duration = 3000) { return new ToastNotification(title, message, type, duration); }

        // --- 全局变量 ---
        let editor;
        let currentFilePath = '';
        let services = [];
        let currentServiceName = '';
        let operationLog = [];
        let serviceLogs = [];

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus().then(loggedIn => {
                if (!loggedIn) { window.location.href = '/login'; return; }

                initializeEditor();
                loadServers();
                loadOperationLog();

                // 事件绑定
                document.getElementById('connectBtn')?.addEventListener('click', connectToServer);
                document.getElementById('refreshFilesBtn')?.addEventListener('click', () => loadFileTree(currentServiceName));
                document.getElementById('saveFileBtn')?.addEventListener('click', saveCurrentFile);
                document.getElementById('compareBtn')?.addEventListener('click', compareWithServer);
                document.getElementById('backupListBtn')?.addEventListener('click', showBackupHistory);
                document.getElementById('submitAddErrorPattern')?.addEventListener('click', addErrorPattern);
                document.getElementById('serverSelector')?.addEventListener('change', handleServerSelection);
                document.getElementById('submitAddServer')?.addEventListener('click', addServer);
                document.getElementById('submitEditServer')?.addEventListener('click', submitEditServer);
                document.getElementById('editServerBtn')?.addEventListener('click', openEditServerModal);
                document.getElementById('authMethod')?.addEventListener('change', toggleAuthFields);
                document.getElementById('editAuthMethod')?.addEventListener('change', toggleEditAuthFields);
                document.getElementById('deleteServerBtn')?.addEventListener('click', deleteSelectedServer);
                document.getElementById('logoutBtn')?.addEventListener('click', logout);
                document.getElementById('refreshServicesBtn')?.addEventListener('click', refreshServiceStatus);
                document.getElementById('toggleSftpBtn')?.addEventListener('click', toggleSftpView);
                document.getElementById('closeSftpBtn')?.addEventListener('click', toggleSftpView);
                document.getElementById('clearOperationLogBtn')?.addEventListener('click', clearOperationLog);
                document.getElementById('clearServiceLogBtn')?.addEventListener('click', clearServiceLogs);

                startErrorLogRefresh();
            });
        });

        // 监听 iframe (SFTP) 消息
        window.addEventListener('message', (event) => {
            if (event.data?.type === 'sftp_operation_log') {
                addOperationLog(event.data.operation, event.data.details);
            }
        });

        // --- 核心逻辑 ---

        function initializeEditor() {
            require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs' } });
            require(['vs/editor/editor.main'], () => {
                editor = monaco.editor.create(document.getElementById('editor'), {
                    value: '', language: 'ini', theme: 'vs', automaticLayout: true,
                    fontSize: 13, fontFamily: "'JetBrains Mono', Consolas, monospace",
                    minimap: { enabled: true, scale: 0.75 },
                    scrollBeyondLastLine: false
                });
                editor.onDidChangeModelContent(() => {
                    if (currentFilePath) document.getElementById('saveFileBtn').disabled = false;
                });
            });
        }

        function toggleSftpView() {
            const sftpContainer = document.getElementById('sftpContainer');
            const configEditor = document.getElementById('configEditorContainer');
            const serverId = document.getElementById('serverSelector').value;
            const isConnected = !document.getElementById('connectionStatus').classList.contains('d-none');

            if (sftpContainer.classList.contains('d-none')) {
                if (!serverId) return showToast('⚠ 选择服务器', '请先选择服务器', 'warning');
                if (!isConnected) return showToast('⚠ 未连接', '请先连接服务器', 'warning');

                sftpContainer.classList.remove('d-none');
                configEditor.classList.add('d-none');
                const iframe = document.getElementById('sftpIframe');
                if (iframe) iframe.src = `/sftp_page?server_id=${encodeURIComponent(serverId)}`;
            } else {
                sftpContainer.classList.add('d-none');
                configEditor.classList.remove('d-none');
                const iframe = document.getElementById('sftpIframe');
                if (iframe) iframe.src = '';
            }
        }

        async function checkLoginStatus() {
            try {
                const res = await fetch('/auth/status');
                if (res.ok) {
                    const data = await res.json();
                    return data.logged_in;
                }
                return false;
            } catch (e) { return false; }
        }

        async function logout() {
            try { await fetch('/auth/logout', { method: 'POST' }); window.location.href = '/login'; } catch (e) { showToast('错误', '登出失败', 'error'); }
        }

        // --- 服务器逻辑 ---

        function toggleAuthFields() {
            const method = document.getElementById('authMethod').value;
            document.getElementById('passwordField').classList.toggle('d-none', method !== 'password');
            document.getElementById('keyField').classList.toggle('d-none', method !== 'key');
        }

        function toggleEditAuthFields() {
            const method = document.getElementById('editAuthMethod').value;
            document.getElementById('editPasswordField').classList.toggle('d-none', method !== 'password');
            document.getElementById('editKeyField').classList.toggle('d-none', method !== 'key');
        }

        let currentServers = []; // 保存服务器列表以供编辑使用

        // ========================================
        // 性能优化：DOM 元素缓存
        // ========================================
        const DOMCache = {
            // 服务器相关
            serverSelector: null,
            connectionStatus: null,
            disconnectedStatus: null,

            // 按钮
            connectBtn: null,
            saveFileBtn: null,
            compareBtn: null,
            backupListBtn: null,

            // 容器
            serviceContainer: null,
            fileTree: null,
            operationLog: null,
            errorLogList: null,
            sftpContainer: null,
            configEditorContainer: null,

            // 文件编辑器
            currentFileName: null,
            lastSavedTime: null,

            // 初始化缓存
            init() {
                this.serverSelector = document.getElementById('serverSelector');
                this.connectionStatus = document.getElementById('connectionStatus');
                this.disconnectedStatus = document.getElementById('disconnectedStatus');
                this.connectBtn = document.getElementById('connectBtn');
                this.saveFileBtn = document.getElementById('saveFileBtn');
                this.compareBtn = document.getElementById('compareBtn');
                this.backupListBtn = document.getElementById('backupListBtn');
                this.serviceContainer = document.getElementById('serviceContainer');
                this.fileTree = document.getElementById('fileTree');
                this.operationLog = document.getElementById('operationLog');
                this.errorLogList = document.getElementById('errorLogList');
                this.sftpContainer = document.getElementById('sftpContainer');
                this.configEditorContainer = document.getElementById('configEditorContainer');
                this.currentFileName = document.getElementById('currentFileName');
                this.lastSavedTime = document.getElementById('lastSavedTime');
            }
        };

        // ========================================
        // 性能优化：统一 API 请求模式
        // ========================================
        const API = {
            /**
             * 统一的 API 请求处理
             * @param {string} url - 请求 URL
             * @param {Object} options - 请求选项
             * @returns {Promise<Object>} 响应数据
             */
            async request(url, options = {}) {
                const defaultOptions = {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                };

                try {
                    const response = await fetch(url, { ...defaultOptions, ...options });

                    if (!response.ok) {
                        const error = await response.json().catch(() => ({ error: '请求失败' }));
                        throw new Error(error.error || `HTTP ${response.status}`);
                    }

                    return await response.json();
                } catch (error) {
                    console.error('API Request Error:', error);
                    throw error;
                }
            },

            // GET 请求
            async get(url) {
                return this.request(url, { method: 'GET' });
            },

            // POST 请求
            async post(url, data = null) {
                return this.request(url, {
                    method: 'POST',
                    body: data ? JSON.stringify(data) : undefined
                });
            },

            // PUT 请求
            async put(url, data) {
                return this.request(url, {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });
            },

            // DELETE 请求
            async delete(url) {
                return this.request(url, { method: 'DELETE' });
            }
        };

        function openEditServerModal() {
            const serverId = document.getElementById('serverSelector').value;
            if (!serverId) {
                showToast('⚠ 未选择', '请先选择要编辑的服务器', 'warning');
                return false;
            }

            // 查找当前服务器信息
            const server = currentServers.find(s => s.id == serverId);
            if (!server) {
                showToast('✗ 错误', '未找到服务器信息', 'error');
                return false;
            }

            // 填充表单
            document.getElementById('editServerName').value = server.name;
            document.getElementById('editServerHost').value = server.host;
            document.getElementById('editServerPort').value = server.port;
            document.getElementById('editServerUsername').value = server.username;
            document.getElementById('editAuthMethod').value = server.auth_method || 'password';
            document.getElementById('editServerPassword').value = ''; // 密码字段清空

            // 更新认证方式显示
            toggleEditAuthFields();
        }

        async function submitEditServer() {
            const serverId = document.getElementById('serverSelector').value;
            if (!serverId) {
                showToast('⚠ 未选择', '请先选择要编辑的服务器', 'warning');
                return;
            }

            const data = {
                id: serverId,
                name: document.getElementById('editServerName').value,
                host: document.getElementById('editServerHost').value,
                port: parseInt(document.getElementById('editServerPort').value),
                username: document.getElementById('editServerUsername').value,
                auth_method: document.getElementById('editAuthMethod').value
            };

            // 如果密码字段不为空，才添加密码
            const password = document.getElementById('editServerPassword').value;
            if (password) {
                data.password = password;
            } else {
                // 保留原密码
                const server = currentServers.find(s => s.id == serverId);
                if (server && server.password) {
                    data.password = server.password;
                }
            }

            try {
                const res = await fetch(`/servers/${serverId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    const updatedServer = await res.json();
                    showToast('✓ 更新成功', data.name, 'success');
                    bootstrap.Modal.getInstance(document.getElementById('editServerModal')).hide();
                    await loadServers();
                    // 保持选中当前服务器
                    document.getElementById('serverSelector').value = serverId;
                    addOperationLog('编辑服务器', `成功更新服务器: ${updatedServer.name}`);
                } else {
                    const err = await res.json();
                    showToast('✗ 失败', err.error, 'error');
                }
            } catch (e) {
                console.error(e);
                showToast('✗ 错误', '网络异常', 'error');
            }
        }

        async function addServer() {
            const data = {
                id: Date.now().toString(),
                name: document.getElementById('serverName').value,
                host: document.getElementById('serverHost').value,
                port: parseInt(document.getElementById('serverPort').value),
                username: document.getElementById('serverUsername').value,
                auth_method: document.getElementById('authMethod').value
            };
            if (data.auth_method === 'password') data.password = document.getElementById('serverPassword').value;
            // 注意：真实场景需处理 key_file 上传

            try {
                const res = await fetch('/servers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                if (res.ok) {
                    const newServer = await res.json();
                    showToast('✓ 添加成功', data.name, 'success');
                    bootstrap.Modal.getInstance(document.getElementById('addServerModal')).hide();
                    loadServers();
                    addOperationLog('添加服务器', `成功添加服务器: ${newServer.name}`);
                } else {
                    const err = await res.json();
                    showToast('✗ 失败', err.error, 'error');
                }
            } catch (e) { showToast('✗ 错误', '网络异常', 'error'); }
        }

        // ========================================
        // 测试连接功能 - 优化后的通用实现
        // ========================================

        /**
         * 通用的服务器连接测试函数
         * @param {string} mode - 测试模式：'add' 或 'edit'
         * @returns {Promise<void>}
         */
        async function testServerConnection(mode = 'add') {
            // 1. 获取表单数据
            const data = getServerFormData(mode);
            if (!data) return; // 数据验证失败

            // 2. 获取测试按钮
            const btnId = mode === 'add' ? 'testAddConnectionBtn' : 'testEditConnectionBtn';
            const testBtn = document.getElementById(btnId);
            const originalHtml = testBtn.innerHTML;

            // 3. 设置按钮加载状态
            testBtn.disabled = true;
            testBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> 测试中...';

            try {
                // 4. 临时添加服务器
                const addRes = await fetch('/servers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!addRes.ok) {
                    const err = await addRes.json();
                    showToast('✗ 错误', err.error, 'error');
                    return;
                }

                const server = await addRes.json();

                // 5. 测试连接
                showToast('测试中...', '正在测试连接', 'info', 2000);
                const testRes = await fetch(`/servers/${server.id}/test_connection`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                // 6. 清理临时服务器
                await fetch(`/servers/${server.id}`, { method: 'DELETE' });

                // 7. 显示测试结果
                handleTestResult(testRes, data);

            } catch (e) {
                console.error('测试连接失败:', e);
                showToast('✗ 错误', '测试连接失败：' + e.message, 'error');
            } finally {
                // 8. 恢复按钮状态
                testBtn.disabled = false;
                testBtn.innerHTML = originalHtml;
            }
        }

        /**
         * 获取服务器表单数据
         * @param {string} mode - 表单模式：'add' 或 'edit'
         * @returns {Object|null} 服务器数据对象，验证失败返回null
         */
        function getServerFormData(mode) {
            const prefix = mode === 'add' ? 'server' : 'editServer';
            const authMethodId = mode === 'add' ? 'authMethod' : 'editAuthMethod';

            const data = {
                id: 'temp-test-' + Date.now().toString(),
                name: document.getElementById(prefix + 'Name').value,
                host: document.getElementById(prefix + 'Host').value,
                port: parseInt(document.getElementById(prefix + 'Port').value),
                username: document.getElementById(prefix + 'Username').value,
                auth_method: document.getElementById(authMethodId).value,
                password: document.getElementById(prefix + 'Password').value
            };

            // 编辑模式特殊处理：如果密码为空，使用原密码
            if (mode === 'edit' && !data.password) {
                const serverId = document.getElementById('serverSelector').value;
                const server = currentServers.find(s => s.id == serverId);
                if (server && server.password) {
                    data.password = server.password;
                }
            }

            // 验证必填字段
            if (!data.host || !data.username || (!data.password && data.auth_method === 'password')) {
                showToast('⚠ 提示', '请先填写完整的服务器信息（主机地址、用户名、密码）', 'warning');
                return null;
            }

            return data;
        }

        /**
         * 处理测试连接结果
         * @param {Response} testRes - 测试连接的响应对象
         * @param {Object} data - 服务器数据
         */
        async function handleTestResult(testRes, data) {
            if (testRes.ok) {
                const result = await testRes.json();
                showToast('✓ 连接成功', result.message, 'success', 5000);
                addOperationLog('测试连接', `测试成功: ${data.name} (${data.host})`);
            } else {
                const err = await testRes.json();
                showToast('✗ 连接失败', err.error, 'error', 5000);
                addOperationLog('测试连接', `测试失败: ${data.name} - ${err.error}`);
            }
        }

        /**
         * 测试添加服务器时的连接
         */
        async function testAddConnection() {
            await testServerConnection('add');
        }

        /**
         * 测试编辑服务器时的连接
         */
        async function testEditConnection() {
            // 验证是否选择了服务器
            const serverId = document.getElementById('serverSelector').value;
            if (!serverId) {
                showToast('⚠ 未选择', '请先选择要编辑的服务器', 'warning');
                return;
            }
            await testServerConnection('edit');
        }

        async function deleteSelectedServer() {
            const id = document.getElementById('serverSelector').value;
            if (!id) return;
            if (!confirm('确定删除该服务器配置吗？')) return;
            try {
                const res = await fetch(`/servers/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('✓ 删除成功', '', 'success');
                    sessionStorage.removeItem('lastSelectedServer');
                    loadServers();
                    addOperationLog('删除服务器', '服务器已删除');
                }
            } catch (e) { showToast('错误', '请求失败', 'error'); }
        }

        async function loadServers() {
            try {
                const res = await fetch('/servers');
                if (res.ok) {
                    const servers = await res.json();
                    currentServers = servers; // 保存服务器列表供编辑使用
                    const sel = document.getElementById('serverSelector');
                    sel.innerHTML = '<option value="">选择服务器...</option>';
                    servers.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.textContent = `${escapeHtml(s.name)} (${escapeHtml(s.host)}) [${escapeHtml(s.username)}]`;
                        sel.appendChild(opt);
                    });
                    const last = sessionStorage.getItem('lastSelectedServer');
                    if (last && servers.some(s => s.id == last)) sel.value = last;
                    handleServerSelection(); // 触发 UI 状态更新
                }
            } catch (e) { console.error(e); }
        }

        function handleServerSelection() {
            const id = document.getElementById('serverSelector').value;
            sessionStorage.setItem('lastSelectedServer', id);
            const connected = document.getElementById('connectionStatus');
            const disconnected = document.getElementById('disconnectedStatus');

            // 切换服务器时重置为未连接状态
            connected.classList.add('d-none');
            disconnected.classList.remove('d-none');
            services = [];
            renderServiceCards();
            document.getElementById('fileTree').innerHTML = id ? '<li class="text-center text-muted small mt-4">请连接服务器</li>' : '<li class="text-center text-muted small mt-4">暂无文件</li>';
            if (editor) editor.setValue('');
        }

        async function connectToServer() {
            const id = document.getElementById('serverSelector').value;
            if (!id) return showToast('⚠', '请先选择服务器', 'warning');

            const btn = document.getElementById('connectBtn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> 连接中';

            try {
                const res = await fetch(`/servers/${id}/connect`, { method: 'POST' });
                if (res.ok) {
                    const result = await res.json();
                    document.getElementById('connectionStatus').classList.remove('d-none');
                    document.getElementById('disconnectedStatus').classList.add('d-none');
                    showToast('✓', '连接成功', 'success');
                    addOperationLog('连接服务器', result.message || '已连接');
                    loadServices();
                } else throw new Error();
            } catch (e) { showToast('✗', '连接失败', 'error'); }
            finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }

        // --- 服务逻辑 ---

        async function loadServices() {
            const id = document.getElementById('serverSelector').value;
            const isConnected = !document.getElementById('connectionStatus').classList.contains('d-none');
            if (!isConnected || !id) { services = []; renderServiceCards(); return; }

            try {
                const res = await fetch(`/services/status?server_id=${id}`);
                services = res.ok ? await res.json() : [];
                renderServiceCards();
            } catch (e) { services = []; renderServiceCards(); }
        }

        async function refreshServiceStatus() {
            if (document.getElementById('connectionStatus').classList.contains('d-none')) return;
            await loadServices();
            showToast('✓', '状态已刷新', 'success');
        }

        function renderServiceCards() {
            const container = document.getElementById('serviceContainer');
            if (services.length === 0) {
                container.innerHTML = `<div class="text-center text-muted mt-5 small"><i class="fas fa-server fa-2x mb-3 opacity-25"></i><p>暂无服务或未连接</p></div>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            services.forEach(svc => {
                const isActive = svc.status === 'active';
                const statusClass = isActive ? 'status-running' : (svc.status === 'inactive' || svc.status === 'failed' ? 'status-stopped' : 'status-unknown');
                const statusText = isActive ? '运行' : (svc.status === 'inactive' ? '停止' : '未知');
                const statusColor = isActive ? 'text-success' : 'text-danger';

                const card = document.createElement('div');
                card.className = 'service-card';
                card.innerHTML = `
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="card-title mb-0 fw-bold text-dark text-truncate" style="max-width: 140px; font-size: 0.9rem;" title="${escapeHtml(svc.display_name)}">${escapeHtml(svc.display_name)}</h6>
                            <div class="d-flex align-items-center">
                                <span class="status-indicator ${statusClass}"></span>
                                <span class="small fw-medium ${statusColor}" style="font-size: 0.75rem;">${statusText}</span>
                            </div>
                        </div>
                        <div class="text-secondary small font-monospace mb-2" style="font-size:0.75rem">${escapeHtml(svc.name)}</div>
                        <div class="service-footer d-flex justify-content-between align-items-center">
                            <div>${svc.has_config ? `<button class="btn btn-sm btn-link text-decoration-none text-primary p-0" style="font-size:0.8rem" onclick="openConfig('${escapeHtml(svc.name)}')" title="编辑配置"><i class="fas fa-cog"></i> 配置</button>` : ''}</div>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-light text-success p-1 px-2" onclick="serviceAction('${escapeHtml(svc.name)}', 'start')" title="启动"><i class="fas fa-play fa-xs"></i></button>
                                <button class="btn btn-light text-warning p-1 px-2" onclick="serviceAction('${escapeHtml(svc.name)}', 'restart')" title="重启"><i class="fas fa-redo fa-xs"></i></button>
                                <button class="btn btn-light text-danger p-1 px-2" onclick="serviceAction('${escapeHtml(svc.name)}', 'stop')" title="停止"><i class="fas fa-stop fa-xs"></i></button>
                            </div>
                        </div>
                    </div>`;
                fragment.appendChild(card);
            });
            container.innerHTML = '';
            container.appendChild(fragment);
        }

        async function serviceAction(name, action) {
            const id = document.getElementById('serverSelector').value;
            try {
                const res = await fetch(`/services/${name}/${action}?server_id=${id}`, { method: 'POST' });
                if (res.ok) {
                    const actionText = { start: '启动', stop: '停止', restart: '重启' }[action];
                    showToast('✓', `${name} ${actionText} 指令已发送`, 'success');
                    addOperationLog('服务操作', `向服务 ${name} 发送 ${action} 命令`);
                    if (action === 'start') setTimeout(() => fetchServiceErrors(name), 2000);
                    setTimeout(loadServices, 1000);
                } else showToast('✗', '操作失败', 'error');
            } catch (e) { showToast('✗', '网络异常', 'error'); }
        }
        // 暴露给 HTML onclick
        window.serviceAction = serviceAction;

        // --- 文件配置逻辑 ---

        window.openConfig = function (serviceName) {
            const id = document.getElementById('serverSelector').value;
            if (!id) return showToast('⚠', '未选择服务器', 'warning');
            currentServiceName = serviceName;

            // 确保显示编辑器视图
            document.getElementById('sftpContainer').classList.add('d-none');
            document.getElementById('configEditorContainer').classList.remove('d-none');

            loadFileTree(serviceName);
        }

        async function loadFileTree(serviceName = currentServiceName) {
            if (!serviceName) return;
            const serverId = document.getElementById('serverSelector').value;
            if (!serverId) { showToast('⚠ 选择服务器', '未选择服务器', 'warning'); return; }

            try {
                const response = await fetch(`/config/files?service=${encodeURIComponent(serviceName)}&server_id=${serverId}`);
                if (response.ok) {
                    const files = await response.json();
                    renderFileTree(files, serviceName);
                } else showToast('✗ 加载失败', '无法加载文件列表', 'error');
            } catch (error) { showToast('✗ 加载失败', error.message, 'error'); }
        }

        function renderFileTree(files, serviceName) {
            const treeContainer = document.getElementById('fileTree');
            treeContainer.innerHTML = '';

            if (files[serviceName]) {
                const serviceNode = document.createElement('li');
                serviceNode.className = 'mb-2';
                serviceNode.innerHTML = `<div class="fw-bold text-dark px-2 py-1 bg-light rounded mb-2 border"><i class="fas fa-box me-2 text-secondary"></i>${serviceName}</div>`;

                const fileList = document.createElement('ul');
                fileList.className = 'list-unstyled ms-2 border-start border-2 border-light ps-2';

                // 文件夹在前，文件在后
                const sortedFiles = [...files[serviceName]].sort((a, b) => {
                    if (a.type === 'directory' && b.type !== 'directory') return -1;
                    if (a.type !== 'directory' && b.type === 'directory') return 1;
                    return a.name.localeCompare(b.name);
                });

                sortedFiles.forEach(fileItem => {
                    const fileName = fileItem.name;
                    const fileNode = document.createElement('li');
                    fileNode.className = 'd-flex justify-content-between align-items-center mb-1 rounded';
                    let iconClass = fileItem.type === 'directory' ? 'fa-folder' : 'fa-file';
                    let textClass = fileItem.type === 'directory' ? 'text-warning' : 'text-secondary';
                    const displayName = fileName.length > 25 ? fileName.substring(0, 22) + '...' : fileName;

                    fileNode.innerHTML = `
                        <div class="text-truncate px-2 py-1 w-100 file-item-hover" style="cursor:pointer; font-size: 0.85rem;" onclick="handleFileClick('${fileItem.path}', '${fileItem.type}')">
                            <i class="fas ${iconClass} me-2 ${textClass}" style="width: 16px; text-align:center;"></i>${displayName}
                        </div>
                        ${fileItem.type !== 'directory' ? `<button class="btn btn-link text-danger p-0 ms-1 opacity-50 hover-opacity-100" style="font-size:0.8rem;" onclick="deleteConfigFile('${fileItem.path}', event)" title="删除文件"><i class="fas fa-times"></i></button>` : ''}`;
                    fileList.appendChild(fileNode);
                });
                serviceNode.appendChild(fileList);
                treeContainer.appendChild(serviceNode);
            } else {
                treeContainer.innerHTML = '<li class="text-center text-muted small mt-4">请选择服务打开配置文件</li>';
            }
        }

        window.handleFileClick = async function (filePath, fileType) {
            if (fileType === 'directory') await browseDirectory(filePath);
            else loadFileContent(filePath);
        }

        async function browseDirectory(dirPath) {
            const serverId = document.getElementById('serverSelector').value;
            if (!serverId) { showToast('⚠ 选择服务器', '未选择服务器', 'warning'); return; }

            try {
                const response = await fetch(`/api/sftp/list?server_id=${serverId}&path=${encodeURIComponent(dirPath)}`);
                if (response.ok) {
                    const items = await response.json();
                    renderDirectoryContents(items, dirPath);
                } else {
                    const errorData = await response.json();
                    showToast('✗ 加载失败', errorData.error || '无法加载目录内容', 'error');
                }
            } catch (error) { showToast('✗ 加载失败', error.message, 'error'); }
        }

        function renderDirectoryContents(items, dirPath) {
            const treeContainer = document.getElementById('fileTree');
            treeContainer.innerHTML = '';
            const parentPath = dirPath.substring(0, dirPath.lastIndexOf('/'));
            const parentItem = document.createElement('li');
            parentItem.className = 'mb-2';
            parentItem.innerHTML = `<div class="text-primary px-2 py-1 fw-bold small" style="cursor:pointer;" onclick="browseUpDirectory('${parentPath}')"><i class="fas fa-level-up-alt me-2"></i>返回上级</div><div class="text-muted small px-2 mb-2 font-monospace bg-light rounded py-1 text-truncate" title="${dirPath}">${dirPath}</div>`;
            treeContainer.appendChild(parentItem);

            const sortedItems = [...items].sort((a, b) => {
                if (a.type === 'directory' && b.type !== 'directory') return -1;
                if (a.type !== 'directory' && b.type === 'directory') return 1;
                return a.name.localeCompare(b.name);
            });

            sortedItems.forEach(item => {
                const itemNode = document.createElement('li');
                itemNode.className = 'd-flex justify-content-between align-items-center mb-1 rounded';
                let iconClass = item.type === 'directory' ? 'fa-folder' : 'fa-file';
                let textClass = item.type === 'directory' ? 'text-warning' : 'text-secondary';
                const displayName = item.name.length > 25 ? item.name.substring(0, 22) + '...' : item.name;

                itemNode.innerHTML = `<div class="text-truncate px-2 py-1 w-100 file-item-hover" style="cursor:pointer; font-size: 0.85rem;" onclick="handleFileClick('${item.path}', '${item.type}')"><i class="fas ${iconClass} me-2 ${textClass}" style="width: 16px;"></i>${displayName}</div>${item.type !== 'directory' ? `<button class="btn btn-link text-danger p-0 ms-1 opacity-50 hover-opacity-100" style="font-size:0.8rem;" onclick="deleteConfigFile('${item.path}', event)"><i class="fas fa-times"></i></button>` : ''}`;
                treeContainer.appendChild(itemNode);
            });
        }

        window.browseUpDirectory = function (path) {
            if (!path && path !== '') { if (currentServiceName) loadFileTree(currentServiceName); return; }
            browseDirectory(path);
        }

        async function loadFileContent(filePath) {
            try {
                const normalizedPath = filePath.replace(/\\/g, '/');
                const serverId = document.getElementById('serverSelector').value;
                if (!serverId) { showToast('⚠ 选择服务器', '未选择服务器', 'warning'); return; }

                const response = await fetch(`/config/files/${encodeURIComponent(normalizedPath)}?server_id=${serverId}`);
                if (!response.ok) throw new Error('加载失败');

                const fileData = await response.json();
                currentFilePath = normalizedPath;
                editor.setValue(fileData.content || '');
                editor.focus();
                editor.revealLine(1);
                document.getElementById('currentFileName').textContent = normalizedPath.split('/').pop();
                document.getElementById('lastSavedTime').textContent = '';
                document.getElementById('saveFileBtn').disabled = true;
                document.getElementById('compareBtn').disabled = false;
                document.getElementById('backupListBtn').disabled = false;
            } catch (error) { showToast('✗ 加载失败', error.message, 'error'); }
        }

        async function saveCurrentFile() {
            if (!currentFilePath) { showToast('⚠', '请先选择要保存的文件', 'warning'); return; }
            const serverId = document.getElementById('serverSelector').value;
            if (!serverId) { showToast('⚠', '未选择服务器', 'warning'); return; }

            const btn = document.getElementById('saveFileBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 保存中';

            try {
                const content = editor.getValue();
                const response = await fetch(`/config/files/${encodeURIComponent(currentFilePath)}?server_id=${serverId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                if (response.ok) {
                    document.getElementById('lastSavedTime').textContent = `已保存 ${new Date().toLocaleTimeString()}`;
                    showToast('✓ 保存成功', '文件已更新并备份', 'success');
                    addOperationLog('保存文件', `文件保存成功: ${currentFilePath}`);
                    if (currentServiceName) loadFileTree(currentServiceName);
                } else throw new Error('保存失败');
            } catch (error) {
                showToast('✗ 保存失败', error.message, 'error');
                addOperationLog('保存文件', `保存失败: ${error.message}`);
                btn.disabled = false;
            } finally {
                if (btn.innerHTML.includes('保存中')) btn.innerHTML = '<i class="fas fa-save me-1"></i> 保存更改';
            }
        }

        window.deleteConfigFile = async function (filePath, event) {
            event.stopPropagation();
            const serverId = document.getElementById('serverSelector').value;
            // 简单判断是否文件夹
            const isDirectory = event.target.closest('li').querySelector('.fa-folder') !== null;
            const type = isDirectory ? '文件夹' : '文件';

            if (!confirm(`确定要删除${type} "${filePath}" 吗？\n\n删除后将无法恢复，请确认！`)) return;

            try {
                const response = await fetch(`/config/files/${encodeURIComponent(filePath)}?server_id=${serverId}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast('✓ 删除成功', `${type}已删除`, 'success');
                    addOperationLog('删除文件', `${type}已删除: ${filePath}`);
                    if (currentServiceName) loadFileTree(currentServiceName);
                } else {
                    const errorData = await response.json();
                    showToast('✗ 删除失败', errorData.error, 'error');
                }
            } catch (error) { showToast('✗ 删除失败', error.message, 'error'); }
        }

        // --- 备份与对比 ---

        async function compareWithServer() {
            if (!currentFilePath) { showToast('⚠ 选择文件', '请先选择一个文件', 'warning'); return; }
            const serverId = document.getElementById('serverSelector').value;

            try {
                const resp = await fetch(`/config/files/${encodeURIComponent(currentFilePath)}?server_id=${serverId}`);
                if (!resp.ok) throw new Error('无法获取服务器文件');
                const fileData = await resp.json();
                const serverText = fileData.content || '';
                const localText = editor.getValue();
                const diff = Diff.diffLines(serverText, localText);

                // 创建或获取 Modal
                let modalEl = document.getElementById('diffModal');
                if (!modalEl) {
                    const div = document.createElement('div');
                    div.innerHTML = `<div class="modal fade" id="diffModal" tabindex="-1"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">文件对比结果</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="d-flex"><div class="w-50 pe-2"><h6 class="text-center mb-3 fw-bold text-secondary">服务器版本</h6><div id="serverDiffContent" class="diff-container"></div></div><div class="w-50 ps-2 border-start"><h6 class="text-center mb-3 fw-bold text-primary">本地编辑器版本</h6><div id="localDiffContent" class="diff-container"></div></div></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button></div></div></div></div>`;
                    document.body.appendChild(div);
                    modalEl = div.querySelector('#diffModal');
                }

                let serverHtml = '', localHtml = '';
                diff.forEach(part => {
                    const value = escapeHtml(part.value);
                    const lines = value.split('\n');
                    if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();

                    if (part.added) localHtml += `<div class="p-1 rounded mb-1" style="background:#dcfce7;color:#166534;">${lines.map(l => '+ ' + l).join('<br>')}</div>`;
                    else if (part.removed) serverHtml += `<div class="p-1 rounded mb-1" style="background:#fee2e2;color:#991b1b;">${lines.map(l => '- ' + l).join('<br>')}</div>`;
                    else {
                        const common = `<div class="p-1 rounded mb-1" style="opacity:0.6">${lines.join('<br>')}</div>`;
                        serverHtml += common; localHtml += common;
                    }
                });
                modalEl.querySelector('#serverDiffContent').innerHTML = serverHtml;
                modalEl.querySelector('#localDiffContent').innerHTML = localHtml;

                new bootstrap.Modal(modalEl).show();
            } catch (err) { showToast('✗ 对比失败', err.message, 'error'); }
        }

        async function showBackupHistory() {
            if (!currentFilePath) { showToast('⚠ 选择文件', '请先打开一个配置文件', 'warning'); return; }
            const serverId = document.getElementById('serverSelector').value;

            const normalizedPath = currentFilePath.replace(/\\/g, '/');
            const dirPath = normalizedPath.substring(0, normalizedPath.lastIndexOf('/'));
            const fileName = normalizedPath.split('/').pop();

            try {
                const response = await fetch(`/config/files?service=${currentServiceName}&server_id=${serverId}`);
                if (!response.ok) throw new Error('加载失败');
                const files = await response.json();
                const serviceFiles = files[currentServiceName] || [];
                // 筛选备份
                const backups = serviceFiles.filter(f => f.path && f.path.startsWith(dirPath) && f.path.includes(`${fileName}.backup_`)).sort((a, b) => b.path.localeCompare(a.path));

                if (backups.length === 0) { showToast('ℹ 提示', '没有找到备份文件', 'info'); return; }

                const listHtml = backups.map(b => {
                    const shortName = b.path.split('/').pop();
                    return `<li class="list-group-item d-flex justify-content-between align-items-center"><span class="font-monospace small">${shortName}</span><div><button class="btn btn-sm btn-outline-primary me-1" onclick="loadFileContent('${b.path}')">查看</button><button class="btn btn-sm btn-outline-success" onclick="restoreBackupFile('${b.path}')">恢复</button></div></li>`;
                }).join('');

                let modalEl = document.getElementById('backupModal');
                if (!modalEl) {
                    const div = document.createElement('div');
                    div.innerHTML = `<div class="modal fade" id="backupModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">备份历史</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><ul class="list-group list-group-flush" id="backupList"></ul></div></div></div></div>`;
                    document.body.appendChild(div);
                    modalEl = div.querySelector('#backupModal');
                }
                document.getElementById('backupList').innerHTML = listHtml;
                new bootstrap.Modal(modalEl).show();
            } catch (error) { showToast('✗ 错误', '无法加载备份历史', 'error'); }
        }

        window.restoreBackupFile = async function (backupPath) {
            const serverId = document.getElementById('serverSelector').value;
            if (!confirm(`确定要用以下文件覆盖当前配置吗？\n${backupPath}`)) return;
            try {
                const response = await fetch(`/config/files/${encodeURIComponent(backupPath)}?server_id=${serverId}`);
                const data = await response.json();
                if (!data.content) throw new Error('无法读取备份文件内容');
                editor.setValue(data.content);
                // 恢复 currentFilePath
                currentFilePath = backupPath.replace(/\.backup_.+$/, '');
                document.getElementById('currentFileName').textContent = currentFilePath.split('/').pop();

                const modalEl = document.getElementById('backupModal');
                bootstrap.Modal.getInstance(modalEl).hide();

                showToast('✓ 已加载', '备份文件已加载，请确认并点击保存', 'success');
                addOperationLog('恢复备份', `已加载备份文件: ${backupPath}`);
            } catch (error) { showToast('✗ 恢复失败', error.message, 'error'); }
        }

        // --- 日志系统 ---

        function addOperationLog(operation, details = '') {
            const now = new Date();
            const logEntry = { id: Date.now(), timestamp: now.toLocaleTimeString('zh-CN'), operation: operation, details: details };
            operationLog.unshift(logEntry);
            if (operationLog.length > 100) operationLog.pop();
            try { localStorage.setItem('operationLog', JSON.stringify(operationLog)); } catch (e) { }
            renderOperationLog();
        }

        function loadOperationLog() {
            try { const savedLog = localStorage.getItem('operationLog'); if (savedLog) operationLog = JSON.parse(savedLog); } catch (e) { }
            renderOperationLog();
        }

        function renderOperationLog() {
            const logContainer = document.getElementById('operationLog');
            if (operationLog.length === 0) { logContainer.innerHTML = '<li class="text-muted small text-center mt-4">暂无操作记录</li>'; return; }
            logContainer.innerHTML = '';
            operationLog.forEach(entry => {
                const logItem = document.createElement('li');
                logItem.innerHTML = `<div class="d-flex justify-content-between"><span class="fw-bold text-dark">${escapeHtml(entry.operation)}</span><small class="text-secondary font-monospace">${entry.timestamp}</small></div>${entry.details ? `<div class="text-secondary small mt-1 text-break">${escapeHtml(entry.details)}</div>` : ''}`;
                logContainer.appendChild(logItem);
            });
        }

        function clearOperationLog() { operationLog = []; localStorage.removeItem('operationLog'); renderOperationLog(); }

        // --- 错误日志监控 ---

        async function addErrorPattern() {
            const keyword = document.getElementById('errorKeyword').value.trim();
            const name = document.getElementById('errorName').value.trim();
            if (!keyword || !name) { showToast('⚠ 输入错误', '请填写完整信息', 'warning'); return; }

            try {
                const response = await fetch('/config/error_patterns');
                let patterns = [];
                if (response.ok) patterns = await response.json();

                if (patterns.some(p => p.keyword === keyword || p.name === name)) { showToast('⚠ 重复项', '规则已存在', 'warning'); return; }

                patterns.push({ keyword, name });
                const saveResponse = await fetch('/config/error_patterns', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patterns) });
                if (saveResponse.ok) {
                    showToast('✓ 添加成功', `已添加: ${name}`, 'success');
                    document.getElementById('addErrorPatternForm').reset();
                    bootstrap.Modal.getInstance(document.getElementById('addErrorPatternModal')).hide();
                    addOperationLog('添加错误信息', `关键字: ${keyword}, 名称: ${name}`);
                } else throw new Error('保存失败');
            } catch (error) { showToast('✗ 添加失败', '请稍后重试', 'error'); }
        }

        async function fetchServiceErrors(serviceName) {
            const serverId = document.getElementById('serverSelector').value;
            if (!serverId) return;
            try {
                const response = await fetch(`/services/${serviceName}/errors?server_id=${serverId}`);
                if (response.ok) {
                    const errors = await response.json();
                    serviceLogs = serviceLogs.filter(log => log.service !== serviceName);
                    serviceLogs.push(...errors);
                    renderServiceLogs();
                }
            } catch (error) { }
        }

        function renderServiceLogs() {
            const logContainer = document.getElementById('errorLogList');
            if (!logContainer) return;
            if (serviceLogs.length === 0) { logContainer.innerHTML = '<li class="text-muted small text-center mt-4">暂无错误日志</li>'; return; }

            const sortedLogs = [...serviceLogs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            const uniqueLogs = [];
            const seenErrors = new Set();
            for (const log of sortedLogs) {
                const errorKey = `${log.service}-${log.error_name}-${log.timestamp}`;
                if (!seenErrors.has(errorKey)) { seenErrors.add(errorKey); uniqueLogs.push(log); }
            }

            logContainer.innerHTML = '';
            uniqueLogs.forEach(entry => {
                const logItem = document.createElement('li');
                logItem.style.borderLeftColor = '#ef4444';
                logItem.innerHTML = `<div class="d-flex justify-content-between"><span class="fw-bold text-danger small">[${escapeHtml(entry.service)}] ${escapeHtml(entry.error_name)}</span><small class="text-secondary font-monospace">${entry.timestamp.split(' ')[1] || entry.timestamp}</small></div><div class="text-secondary small text-break mt-1 font-monospace">${escapeHtml(entry.log_line)}</div>`;
                logContainer.appendChild(logItem);
            });
        }

        function clearServiceLogs() { serviceLogs = []; renderServiceLogs(); }

        function startErrorLogRefresh() {
            setInterval(() => {
                const serverId = document.getElementById('serverSelector').value;
                const isConnected = !document.getElementById('connectionStatus').classList.contains('d-none');
                if (serverId && isConnected && services.length > 0) {
                    services.forEach(service => fetchServiceErrors(service.name));
                }
            }, 20000);
        }
    </script>
</body>

</html>
