<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SFTP 文件管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --tech-blue: #007bff;
      --tech-light: #00d4ff;
      --tech-purple: #7c3aed;
      --tech-cyan: #00d9ff;
      --tech-dark: #0a1628;
      --tech-light-bg: #e0f4ff;
      --glass-bg: rgba(255, 255, 255, 0.25);
      --card-bg: rgba(255, 255, 255, 0.85);
      --success-color: #28a745;
      --error-color: #dc3545;
      --warning-color: #ffc107;
      --info-color: #0d6efd;
      --unknown-color: #6c757d;
    }

    body {
      padding: 20px;
      background: linear-gradient(135deg, #cfe9ff 0%, #e7f6ff 50%, #bde0fe 100%);
      background-attachment: fixed;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      max-width: 100%;
    }

    /* 卡片样式 */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .glass-card:hover {
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      transform: translateY(-2px);
    }

    .card-header {
      background: linear-gradient(135deg, var(--tech-blue), var(--tech-light));
      color: white;
      border-bottom: none;
      padding: 12px 16px;
      font-weight: 600;
    }

    .table-responsive {
      border-radius: 0 0 12px 12px;
      position: relative;
    }

    .table {
      margin-bottom: 0;
      font-size: 0.85rem;
      table-layout: fixed;
    }

    /* 固定表头样式 - 不透明 */
    .table thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .table th {
      background-color: #f8f9fa;
      border-bottom: 2px solid #dee2e6;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 10px 8px;
      position: sticky;
      top: 0;
      z-index: 11;
    }

    .table td {
      padding: 8px;
      vertical-align: middle;
      overflow: hidden;
    }

    .file-row {
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .file-row:hover {
      background-color: rgba(67, 97, 238, 0.05);
    }

    .path-breadcrumb {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.7);
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 5px;
      display: inline-block;
    }

    /* 文件名显示优化 */
    .filename-cell {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      position: relative;
      width: 100%;
      max-width: 180px;
      cursor: pointer;
    }

    /* 按钮样式 */
    .btn {
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--tech-blue), var(--tech-light));
      border: none;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0069d9, #00b8e6);
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success-color), #20c997);
      border: none;
    }

    .btn-success:hover {
      background: linear-gradient(135deg, #218838, #1ea085);
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
    }

    .btn-outline-primary {
      border-color: var(--tech-blue);
      color: var(--tech-blue);
    }

    .btn-outline-primary:hover {
      background-color: var(--tech-blue);
      border-color: var(--tech-blue);
      color: white;
    }

    .btn-outline-secondary {
      border-color: var(--unknown-color);
      color: var(--unknown-color);
    }

    .btn-outline-secondary:hover {
      background-color: var(--unknown-color);
      border-color: var(--unknown-color);
      color: white;
    }

    .btn-outline-danger {
      border-color: var(--error-color);
      color: var(--error-color);
    }

    .btn-outline-danger:hover {
      background-color: var(--error-color);
      border-color: var(--error-color);
      color: white;
    }

    .progress {
      height: 8px;
      border-radius: 4px;
      background-color: rgba(0, 123, 255, 0.1);
    }

    .progress-bar {
      background: linear-gradient(90deg, var(--tech-blue), var(--tech-light));
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 10px;
    }

    .form-control, .form-select {
      border-radius: 8px;
      border: 1px solid rgba(0, 123, 255, 0.2);
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--tech-blue);
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    /* 拖拽区域样式 */
    .drop-zone {
      transition: all 0.3s ease;
    }

    .drop-zone.dragover {
      border-color: #007bff;
      background-color: rgba(0, 123, 255, 0.1);
    }

    /* 文件类型图标 */
    .file-icon {
      width: 20px;
      text-align: center;
      margin-right: 8px;
    }

    .folder-icon {
      color: #ffa500;
    }

    .file-icon-text {
      color: var(--unknown-color);
    }

    .file-icon-image {
      color: var(--info-color);
    }

    .file-icon-code {
      color: var(--tech-purple);
    }

    .file-icon-pdf {
      color: var(--error-color);
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 123, 255, 0.3);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 123, 255, 0.5);
    }

    /* 响应式调整 */
    @media (max-width: 768px) {
      .card-body.p-0 .table-responsive {
        max-height: 40vh;
      }
    }

    /* 选中效果 */
    .selected {
      background: linear-gradient(90deg, rgba(0, 123, 255, 0.1), rgba(0, 212, 255, 0.1)) !important;
    }

    /* 操作按钮容器 */
    .action-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: nowrap;
    }
    
    /* 悬浮操作按钮容器 */
    .file-actions {
      display: none;
      gap: 4px;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      justify-content: center;
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .file-row:hover .file-actions {
      display: flex;
    }

    .file-row.renaming .file-actions {
      display: none !important;
    }

    /* 顶部连接区域 */
    .top-connection {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .file-action-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .file-action-btn:hover {
      background: rgba(0, 123, 255, 0.1);
      transform: translateY(-1px);
    }

    .file-action-btn svg {
      width: 14px;
      height: 14px;
      color: var(--tech-blue);
    }

    .file-action-btn.delete svg {
      color: var(--error-color);
    }

    .file-action-btn.rename svg {
      color: var(--warning-color);
    }
    
    .file-action-btn.chown svg {
      color: var(--info-color);
    }
    
    .file-action-btn.permissions svg {
      color: var(--tech-purple);
    }

    /* 文件名容器 */
    .filename-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .filename-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    
    /* 重命名输入框和按钮 */
    .rename-wrapper input, .rename-wrapper .btn-group {
      position: relative;
      z-index: 10000;
    }
    
    /* 重命名包装容器 */
    .file-row.renaming .filename-container {
      overflow: visible !important;
      z-index: 10000;
      position: relative;
    }
    
    /* 确保重命名时文件行有足够高的z-index */
    .file-row.renaming {
      z-index: 10000;
      position: relative;
    }

    /* Tooltip 样式 */
    .tooltip {
      position: absolute;
      z-index: 1070;
      display: block;
      margin: 0;
      font-style: normal;
      font-weight: 400;
      line-height: 1.5;
      text-align: left;
      text-decoration: none;
      text-shadow: none;
      text-transform: none;
      letter-spacing: normal;
      word-break: normal;
      word-spacing: normal;
      white-space: normal;
      line-break: auto;
      font-size: 0.875rem;
      word-wrap: break-word;
      opacity: 0;
    }

    .tooltip.show {
      opacity: 0.9;
    }

    .tooltip .tooltip-arrow {
      position: absolute;
      display: block;
      width: 0.8rem;
      height: 0.4rem;
    }

    .tooltip .tooltip-arrow::before {
      position: absolute;
      content: "";
      border-color: transparent;
      border-style: solid;
    }

    .bs-tooltip-top .tooltip-arrow {
      bottom: 0;
    }

    .bs-tooltip-top .tooltip-arrow::before {
      top: -1px;
      border-width: 0.4rem 0.4rem 0;
      border-top-color: #000;
    }

    .bs-tooltip-bottom .tooltip-arrow {
      top: 0;
    }

    .bs-tooltip-bottom .tooltip-arrow::before {
      bottom: -1px;
      border-width: 0 0.4rem 0.4rem;
      border-bottom-color: #000;
    }

    .tooltip-inner {
      max-width: 200px;
      padding: 0.25rem 0.5rem;
      color: #fff;
      text-align: center;
      background-color: #000;
      border-radius: 0.375rem;
    }

    /* 重命名样式修复 */
    .rename-wrapper {
      display: flex !important;
      align-items: center;
      position: absolute !important;
      left: 0;
      top: 0;
      width: 50% !important;
      height: 100%;
      background: white;
      z-index: 10000 !important;
      padding: 0 7px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 4px;
    }

    .rename-wrapper input {
      flex: 1;
      margin-right: 8px;
      min-width: 0;
      height: 28px;
      padding: 0 8px;
      font-size: 0.85rem;
    }

    .rename-wrapper .btn-group {
      display: flex;
      flex-shrink: 0;
    }

    .rename-wrapper .btn {
      padding: 0 6px;
      height: 12px;
      font-size: 0.7rem;
      min-width: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 文件名列宽度调整 */
    .table td:nth-child(2) {
      position: relative;
      min-width: 200px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部连接区域 -->
    <div class="top-connection">
      <!-- 移除了顶部显示当前用户的元素，因为用户希望在每个服务器选项中显示用户名 -->
      <select id="sftpServerSelector" class="form-select form-select-sm" style="width:200px;">
        <option value="">请选择服务器</option>
      </select>
      <button id="connectSftpBtn" class="btn btn-sm btn-primary">连接服务器</button>
      <button id="refreshListBtn" class="btn btn-sm btn-outline-secondary">刷新</button>
      <span class="badge bg-secondary" id="sftpStatus">未连接</span>
    </div>

    <div class="row">
      <!-- 左：文件列表 - 调整为更小的宽度 -->
      <div class="col-md-8">
        <div class="glass-card mb-3">
          <div class="card-header d-flex align-items-center justify-content-between">
            <div>
              <strong>文件列表</strong>
              <div class="path-breadcrumb" id="currentPath">/</div>
            </div>
            <div>
              <button id="btnUp" class="btn btn-sm btn-outline-secondary">上级</button>
              <button id="btnNewFolder" class="btn btn-sm btn-success">新建目录</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive" style="max-height:60vh; overflow:auto;">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th style="width:40px">类型</th>
                    <th style="width:180px">文件名</th>
                    <th style="width:80px">大小</th>
                    <th style="width:140px">修改时间</th>
                    <th style="width:75px">权限</th>
                    <th style="width:75px">用户:组</th>
                  </tr>
                </thead>
                <tbody id="fileTableBody">
                  <tr><td colspan="6" class="text-center text-muted">请选择服务器并连接后查看文件</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- 右：操作面板 - 增加宽度 -->
      <div class="col-md-4">
        <div class="glass-card mb-3">
          <div class="card-header d-flex align-items-center justify-content-between">
            <strong>上传文件</strong>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">上传至：</label>
              <div class="input-group">
                <input id="uploadPath" class="form-control form-control-sm" value="/" />
              </div>

              <!-- 添加拖拽上传区域 -->
              <div id="dropZone" class="drop-zone border rounded p-3 text-center mt-2" style="border: 2px dashed #ccc; cursor: pointer;">
                <p class="mb-1">拖拽文件到此处</p>
                <div id="dropZoneFileList" class="text-start mt-2" style="display: none;">
                  <small class="fw-bold">已选择文件:</small>
                  <ul id="dropZoneFileListItems" class="mb-0 ps-3 small"></ul>
                </div>
                <small class="text-muted">支持多文件拖拽上传</small>
              </div>

              <div class="d-flex gap-1 mt-2">
                <input id="fileInput" type="file" multiple class="d-none" />
                <button id="pickFilesBtn" class="btn btn-sm btn-outline-primary flex-fill">选择文件</button>
                <button id="uploadBtn" class="btn btn-sm btn-success flex-fill">上传</button>
              </div>
              <div id="uploadProgressContainer" class="mt-2"></div>
            </div>

            <div class="mt-3">
              <small class="text-muted">说明：上传会由后端中转到目标服务器（使用已连接的 SSH）。</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== 页面状态 =====
    let currentPath = '/';
    let currentServerId = '';
    let fileList = []; // 当前目录文件数组
    let draggedFiles = null; // 存储拖拽的文件

    document.addEventListener('DOMContentLoaded', () => {
      // 检查URL参数中是否包含server_id
      const urlParams = new URLSearchParams(window.location.search);
      const serverIdFromUrl = urlParams.get('server_id');

      if (serverIdFromUrl) {
        // 如果URL中有server_id参数，先初始化服务器列表，然后自动选择并连接该服务器
        initServerSelector().then(() => {
          setTimeout(() => {
            const serverSelector = document.getElementById('sftpServerSelector');
            if (serverSelector) {
              serverSelector.value = serverIdFromUrl;
              currentServerId = serverIdFromUrl;
              // 自动连接服务器
              connectServerFromSelector(true);
            }
          }, 100);
        });
      } else {
        initServerSelector().then(() => {
          // 尝试从 sessionStorage 获取之前选择的服务器
          const lastServerId = sessionStorage.getItem('lastSelectedServer');
          if (lastServerId) {
            const serverSelector = document.getElementById('sftpServerSelector');
            if (serverSelector) {
              serverSelector.value = lastServerId;
              currentServerId = lastServerId;
              updateStatus();
            }
          }
        });
      }
      bindUI();
      initDragAndDrop(); // 初始化拖拽功能
    });

    // 初始化服务器下拉（从 /servers 接口获取）
    async function initServerSelector() {
      try {
        const resp = await fetch('/servers');
        if (!resp.ok) return;
        const servers = await resp.json();
        const sel = document.getElementById('sftpServerSelector');
        sel.innerHTML = '<option value="">请选择服务器</option>';
        servers.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = `${s.name} (${s.host}) [${s.username}]`;
          sel.appendChild(opt);
        });
        return Promise.resolve();
      } catch (e) {
        console.error('加载服务器失败', e);
        return Promise.reject(e);
      }
    }

    // 初始化拖拽功能
    function initDragAndDrop() {
      const dropZone = document.getElementById('dropZone');

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
      });

      dropZone.addEventListener('dragover', highlight, false);
      dropZone.addEventListener('dragenter', highlight, false);
      dropZone.addEventListener('dragleave', unhighlight, false);
      dropZone.addEventListener('drop', handleDrop, false);
    }

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    function highlight() {
      const dropZone = document.getElementById('dropZone');
      dropZone.style.borderColor = '#007bff';
      dropZone.style.backgroundColor = 'rgba(0, 123, 255, 0.1)';
    }

    function unhighlight() {
      const dropZone = document.getElementById('dropZone');
      dropZone.style.borderColor = '#ccc';
      dropZone.style.backgroundColor = '';
    }

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;

      handleFiles(files);
      unhighlight();
    }

    function handleFiles(files) {
      // 直接将文件存储在全局变量中，供上传使用
      draggedFiles = files;

      // 显示文件名列表
      const fileNamesList = document.getElementById('dropZoneFileListItems');
      const fileListContainer = document.getElementById('dropZoneFileList');

      // 清空之前的列表
      fileNamesList.innerHTML = '';

      // 添加每个文件到列表
      Array.from(files).forEach(file => {
        const li = document.createElement('li');
        li.textContent = `${file.name} (${formatFileSize(file.size)})`;
        fileNamesList.appendChild(li);
      });

      // 显示文件列表区域
      fileListContainer.style.display = files.length > 0 ? 'block' : 'none';

      addLog('拖拽文件', `已选择 ${files.length} 个文件`);
    }

    function bindUI() {
      document.getElementById('sftpServerSelector').addEventListener('change', e => {
        currentServerId = e.target.value;
        updateStatus();
      });
      document.getElementById('connectSftpBtn').addEventListener('click', connectServerFromSelector);
      document.getElementById('refreshListBtn').addEventListener('click', () => loadPath(currentPath));
      document.getElementById('btnUp').addEventListener('click', () => {
        if (currentPath === '/' || !currentPath) return;
        const parent = currentPath.replace(/\/+$/, '').split('/').slice(0,-1).join('/') || '/';
        loadPath(parent);
      });

      document.getElementById('pickFilesBtn').addEventListener('click', () => document.getElementById('fileInput').click());
      document.getElementById('fileInput').addEventListener('change', e => {
        // 简单展示选中文件名
        const names = Array.from(e.target.files).map(f => f.name).join(', ');
        addLog('选择文件', names || '无');
        draggedFiles = e.target.files; // 将选择的文件存储到draggedFiles变量中
      });
      document.getElementById('uploadBtn').addEventListener('click', uploadSelectedFiles);
      document.getElementById('btnNewFolder').addEventListener('click', () => {
        const name = prompt('请输入新目录名：');
        if (name) createDirectory(currentPath.endsWith('/') ? currentPath + name : currentPath + '/' + name);
      });
    }

    function updateStatus() {
      const badge = document.getElementById('sftpStatus');
      if (!currentServerId) {
        badge.textContent = '未选择';
        badge.className = 'badge bg-secondary';
        return;
      }
      // 判断是否已连接（调用你的 /auth/status 或直接尝试 list）
      // 这里简单尝试读取根目录来验证连接
      showLoading(true);
      fetch(`/api/sftp/list?server_id=${encodeURIComponent(currentServerId)}&path=/`).then(r => {
        if (r.ok) {
          badge.textContent = '在线';
          badge.className = 'badge bg-success';
          loadPath('/');
        }
        else {
          badge.textContent = '未连接或无权限';
          badge.className = 'badge bg-warning text-dark';
          // 尝试连接服务器
          connectServerFromSelector(true);
        }
        showLoading(false);
      }).catch((e) => {
        console.error(e);
        badge.textContent = '未连接';
        badge.className = 'badge bg-secondary';
        showLoading(false);
      });
    }

    async function connectServerFromSelector(quiet = false) {
      const sid = document.getElementById('sftpServerSelector').value;
      if (!sid) {
        if (!quiet) alert('请选择服务器');
        return;
      }
      try {
        // 触发后端 connect（你的 /servers/<id>/connect），以便建立 active_connections
        const resp = await fetch(`/servers/${sid}/connect`, { method: 'POST' });
        if (resp.ok) {
          addLog('连接服务器', `已连接 ${sid}`);
          currentServerId = sid;
          // 保存到 sessionStorage
          sessionStorage.setItem('lastSelectedServer', sid);
          // 更新状态显示
          const badge = document.getElementById('sftpStatus');
          badge.textContent = '在线';
          badge.className = 'badge bg-success';
          loadPath('/');
        } else {
          const err = await resp.json().catch(()=>({error:'连接失败'}));
          if (!quiet) alert(`连接失败: ${err.error || '未知错误'}`);
        }
      } catch (e) {
        console.error(e);
        if (!quiet) alert('连接异常，请检查控制台');
      }
    }

    // 加载目录
    async function loadPath(path) {
      if (!currentServerId) { alert('请选择服务器并连接'); return; }
      const target = path || '/';
      try {
        showLoading(true);
        const resp = await fetch(`/api/sftp/list?server_id=${encodeURIComponent(currentServerId)}&path=${encodeURIComponent(target)}`);
        if (!resp.ok) {
          const errorData = await resp.json().catch(() => ({ error: '无法读取目录' }));
          alert(`无法读取目录: ${errorData.error || '未知错误'}`);
          showLoading(false);
          return;
        }
        const arr = await resp.json();
        currentPath = target;
        document.getElementById('currentPath').textContent = currentPath;
        document.getElementById('uploadPath').value = currentPath;

        // 排序文件列表：文件夹在前，按字母排序
        const sortedItems = sortFileList(arr);
        renderFileTable(sortedItems);
        showLoading(false);
      } catch (e) {
        console.error(e);
        alert(`读取失败: ${e.message}`);
        showLoading(false);
      }
    }

    function showLoading(show) {
      const tbody = document.getElementById('fileTableBody');
      if (show) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center"><div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">加载中...</span></div></td></tr>';
      }
    }

    // 文件列表排序函数
    function sortFileList(items) {
      if (!items || items.length === 0) return [];

      // 分离文件夹和文件
      const folders = items.filter(item => item.type === 'directory');
      const files = items.filter(item => item.type !== 'directory');

      // 分别按名称排序（不区分大小写）
      folders.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { sensitivity: 'base' }));
      files.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { sensitivity: 'base' }));

      // 合并结果：文件夹在前，文件在后
      return [...folders, ...files];
    }

    // 格式化时间函数
    function formatDateTime(timestamp) {
      if (!timestamp) return '';

      const date = new Date(timestamp * 1000);

      // 确保两位数格式
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');

      return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    // 格式化文件权限显示
    function formatFileMode(mode) {
      if (!mode) return '';

      // 如果是数字格式的权限（如 0o775），转换为 rwx 格式
      if (typeof mode === 'string' && mode.startsWith('0o')) {
        try {
          const octal = mode.slice(2); // 去掉 "0o" 前缀
          const perms = parseInt(octal, 8);
          return formatOctalMode(perms);
        } catch (e) {
          console.error('权限格式化错误:', e);
          return mode; // 如果转换失败，返回原始值
        }
      }

      // 如果是数字（如 33261），直接转换
      if (typeof mode === 'number') {
        return formatOctalMode(mode);
      }

      // 如果已经是 rwx 格式，直接返回
      if (typeof mode === 'string' && mode.match(/^([r-][w-][x-]){3}$/)) {
        return mode;
      }

      return mode; // 其他情况返回原始值
    }

    // 将八进制权限数字转换为 rwx 格式字符串
    function formatOctalMode(mode) {
      const perms = [
        (mode & 0o400) ? 'r' : '-',
        (mode & 0o200) ? 'w' : '-',
        (mode & 0o100) ? 'x' : '-',
        (mode & 0o040) ? 'r' : '-',
        (mode & 0o020) ? 'w' : '-',
        (mode & 0o010) ? 'x' : '-',
        (mode & 0o004) ? 'r' : '-',
        (mode & 0o002) ? 'w' : '-',
        (mode & 0o001) ? 'x' : '-'
      ];
      return perms.join('');
    }

    // 渲染文件表格
    function renderFileTable(items) {
      fileList = items || [];
      const tbody = document.getElementById('fileTableBody');
      tbody.innerHTML = '';
      if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">空目录</td></tr>';
        return;
      }

      items.forEach(it => {
        const tr = document.createElement('tr');
        tr.className = 'file-row';

        // 根据文件类型选择图标
        let iconClass = 'file-icon-text';
        if (it.type === 'directory') {
          iconClass = 'folder-icon';
        } else if (it.name.match(/\.(jpg|jpeg|png|gif|bmp|webp)$/i)) {
          iconClass = 'file-icon-image';
        } else if (it.name.match(/\.(pdf)$/i)) {
          iconClass = 'file-icon-pdf';
        } else if (it.name.match(/\.(js|py|java|c|cpp|html|css|json|xml|sql)$/i)) {
          iconClass = 'file-icon-code';
        }

        const iconElement = it.type === 'directory' ?
          `<i class="fas fa-folder ${iconClass}"></i>` :
          `<i class="fas fa-file ${iconClass}"></i>`;

        // 构造用户和组信息显示
        let userGroupInfo = '-';
        if (it.user && it.group) {
          userGroupInfo = `${it.user}:${it.group}`;
        } else if (it.uid !== undefined && it.gid !== undefined) {
          userGroupInfo = `${it.uid}:${it.gid}`;
        }

        // 创建操作按钮（为文件夹和文件都创建操作按钮）
        const operationButtons = createActionButtons(it);

        tr.innerHTML = `
          <td>${iconElement}</td>
          <td>
            <div class="filename-container">
              <span class="filename-text" data-bs-toggle="tooltip" data-bs-placement="top" title="${it.name}">
                ${it.name}
              </span>
            </div>
          </td>
          <td>${it.type==='directory' ? '-' : humanFileSize(it.size)}</td>
          <td class="position-relative">${formatDateTime(it.mtime)}<div class="file-actions">${operationButtons}</div></td>
          <td>${formatFileMode(it.mode) || ''}</td>
          <td>${userGroupInfo}</td>
        `;

        // 为文件名添加点击事件
        const filenameSpan = tr.querySelector('.filename-text');
        filenameSpan.addEventListener('click', () => {
          // 隐藏所有已显示的tooltip
          const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
          tooltipTriggerList.map(function (tooltipTriggerEl) {
            const tooltip = bootstrap.Tooltip.getInstance(tooltipTriggerEl);
            if (tooltip) {
              tooltip.hide();
            }
          });

          if (it.type === 'directory') {
            loadPath(it.path);
          } else {
            document.getElementById('newNameInput').value = it.name;
          }
        });

        tbody.appendChild(tr);
      });

      // 重新初始化 Tooltip
      const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });
    }

    // 添加文件大小格式化函数
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // 简单文件大小格式化
    function humanFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const sizes = ['B','KB','MB','GB','TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + sizes[i];
    }

    // 上传实现：使用 XMLHttpRequest 以获得上传进度
    function uploadSelectedFiles() {
      if (!currentServerId) { alert('请选择服务器'); return; }

      // 获取文件（优先使用拖拽的文件，其次使用选择的文件）
      const files = draggedFiles || document.getElementById('fileInput').files;

      if (!files || files.length === 0) { alert('请选择文件'); return; }
      const target = document.getElementById('uploadPath').value || currentPath || '/';
      const form = new FormData();
      for (let i=0;i<files.length;i++) form.append('files', files[i]);
      form.append('path', target);
      form.append('server_id', currentServerId);
      // 使用 XMLHttpRequest 以获得进度条
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `/api/sftp/upload?server_id=${encodeURIComponent(currentServerId)}&path=${encodeURIComponent(target)}`, true);
      // 进度
      const progressContainer = document.getElementById('uploadProgressContainer');
      progressContainer.innerHTML = '';
      const progressBar = document.createElement('div');
      progressBar.className = 'progress';
      progressBar.innerHTML = '<div class="progress-bar" role="progressbar" style="width:0%"></div>';
      progressContainer.appendChild(progressBar);
      xhr.upload.onprogress = function(ev) {
        if (ev.lengthComputable) {
          const percent = Math.round((ev.loaded / ev.total) * 100);
          progressBar.querySelector('.progress-bar').style.width = percent + '%';
        }
      };
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          addLog('上传完成', xhr.responseText);
          loadPath(currentPath);
        } else {
          alert(`上传失败: ${xhr.responseText}`);
        }
        // 清理进度条
        setTimeout(()=>progressContainer.innerHTML='', 1500);

        // 重置文件选择
        draggedFiles = null;
        document.getElementById('fileInput').value = '';
        // 重置拖拽区域文本
        const dropZone = document.getElementById('dropZone');
        if (dropZone) {
          dropZone.innerHTML = `<p class="mb-1">拖拽文件到此处</p>
          <div id="dropZoneFileList" class="text-start mt-2" style="display: none;">
          <small class="fw-bold">已选择文件:</small>
          <ul id="dropZoneFileListItems" class="mb-0 ps-3 small"></ul>
          </div>
          <small class="text-muted">支持多文件拖拽上传</small>`;
        }
      };
      xhr.onerror = function() {
        alert('上传出错');
        progressContainer.innerHTML = '';
      };
      xhr.send(form);
      addLog('开始上传', `${files.length} 个文件 -> ${target}`);
    }

    // 开始重命名过程 - 仿腾讯云样式
    function startRename(encPath, buttonElement) {
      const path = decodeURIComponent(encPath);
      const fileListItems = fileList || [];
      const item = fileListItems.find(it => it.path === path);

      if (!item) return;

      // 找到对应的文件名span元素
      const row = buttonElement.closest('.file-row');
      const filenameContainer = row.querySelector('.filename-container');
      const originalName = item.name;

      // 保存原始HTML结构，用于恢复
      row.dataset.originalHtml = row.innerHTML;

      // 重新构建整行HTML，只保留文件名列
      row.innerHTML = `
        <td colspan="6" style="padding: 20px 8px;">
          <div class="rename-wrapper d-flex align-items-center" style="width: 100%;">
            <input type="text" class="form-control form-control-sm me-1" value="${originalName}" 
                   style="flex: 1; height: 35px; padding: 0 4px;">
            <div class="btn-group" style="display: flex; gap: 2px;">
              <button class="btn btn-success btn-sm p-1" title="确认" 
                      style="min-width: 24px; height: 24px;">
                <i class="fas fa-check"></i>
              </button>
              <button class="btn btn-secondary btn-sm p-1" title="取消" 
                      style="min-width: 24px; height: 24px;">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
        </td>
      `;

      // 添加重命名状态类
      row.classList.add('renaming');

      // 获取输入框和按钮
      const input = row.querySelector('input');
      const confirmBtn = row.querySelector('.btn-success');
      const cancelBtn = row.querySelector('.btn-secondary');

      // 聚焦到输入框，但不选中任何内容
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);

      // 绑定确认事件
      confirmBtn.addEventListener('click', function() {
        finishRename(path, input.value, originalName, row);
      });

      // 绑定取消事件
      cancelBtn.addEventListener('click', function() {
        cancelRename(row, originalName);
      });

      // 绑定回车确认事件
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          finishRename(path, input.value, originalName, row);
        }
      });

      // 绑定ESC取消事件
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          cancelRename(row, originalName);
        }
      });
    }

    // 完成重命名
    function finishRename(path, newName, originalName, row) {
      // 验证输入
      if (!newName || newName.trim() === '') {
        alert('文件名不能为空');
        return;
      }

      if (newName === originalName) {
        // 如果名称为未更改，取消重命名
        cancelRename(row, originalName);
        return;
      }

      // 执行重命名
      const newPath = path.split('/').slice(0, -1).concat([newName]).join('/');
      performRename(path, newPath);

      // 恢复原始显示
      cancelRename(row, newName);
    }

    // 取消重命名
    function cancelRename(row, fileName) {
      // 恢复原始HTML结构
      if (row.dataset.originalHtml) {
        row.innerHTML = row.dataset.originalHtml;
        delete row.dataset.originalHtml;
      }

      // 移除重命名状态类名
      row.classList.remove('renaming');

      // 重新绑定文件名点击事件和tooltip
      const filenameSpan = row.querySelector('.filename-text');
      if (filenameSpan) {
        // 重新初始化 Tooltip
        new bootstrap.Tooltip(filenameSpan);
        
        // 重新绑定点击事件
        filenameSpan.addEventListener('click', () => {
          // 隐藏所有已显示的tooltip
          const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
          tooltipTriggerList.map(function (tooltipTriggerEl) {
            const tooltip = bootstrap.Tooltip.getInstance(tooltipTriggerEl);
            if (tooltip) {
              tooltip.hide();
            }
          });
          
          // 查找文件项
          const fileListItems = fileList || [];
          const item = fileListItems.find(it => it.name === fileName);
          if (item && item.type === 'directory') {
            loadPath(item.path);
          }
        });
      }
    }

    // 执行重命名
    async function performRename(oldPath, newPath) {
      try {
        const resp = await fetch('/api/sftp/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ server_id: currentServerId, old_path: oldPath, new_path: newPath })
        });
        if (resp.ok) {
          addLog('重命名', `${oldPath} -> ${newPath}`);
          loadPath(currentPath);
        } else {
          const j = await resp.json().catch(()=>({error:'重命名失败'}));
          alert(`重命名失败: ${j.error||''}`);
        }
      } catch (e) {
        console.error(e);
      }
    }

    // 删除路径（文件或文件夹）
    async function deletePath(encPath) {
      const path = decodeURIComponent(encPath);

      // 确定路径类型以在确认信息中显示
      const fileListItems = fileList || [];
      const item = fileListItems.find(it => it.path === path);
      const type = item && item.type === 'directory' ? '文件夹' : '文件';

      const message = `确认删除${type} "${path}" 吗？\n\n删除后将无法恢复，请确认！`;
      if (!confirm(message)) return;

      try {
        const resp = await fetch(`/api/sftp/delete?server_id=${encodeURIComponent(currentServerId)}&path=${encodeURIComponent(path)}`, { method: 'DELETE' });
        if (resp.ok) {
          addLog('删除', path);
          loadPath(currentPath);
        } else {
          const j = await resp.json().catch(()=>({error:'删除失败'}));
          alert(`删除失败: ${j.error||''}`);
        }
      } catch (e) {
        console.error(e);
      }
    }

    // 下载文件
    function downloadPath(encPath) {
      const path = decodeURIComponent(encPath);
      // 直接触发后端下载接口
      const url = `/api/sftp/download?server_id=${encodeURIComponent(currentServerId)}&path=${encodeURIComponent(path)}`;
      // 使用 a 标签下载
      const a = document.createElement('a');
      a.href = url;
      a.download = ''; // 让浏览器提示下载
      document.body.appendChild(a);
      a.click();
      a.remove();
      addLog('下载', path);
    }

    // 下载选中的多个（顺序触发）
    function downloadSelected() {
      const selected = Array.from(document.querySelectorAll('.file-row.selected'));
      if (selected.length === 0) { alert('请选择文件'); return; }
      for (const row of selected) {
        const path = row.querySelector('.filename-text').getAttribute('title');
        downloadPath(encodeURIComponent(path));
      }
    }

    // 创建目录
    async function createDirectory(path) {
      try {
        const resp = await fetch('/api/sftp/mkdir', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ server_id: currentServerId, path })
        });
        if (resp.ok) { addLog('新建目录', path); loadPath(currentPath); }
        else { const j = await resp.json().catch(()=>({error:'创建失败'})); alert(`创建失败:${j.error||''}`); }
      } catch (e) { console.error(e); }
    }

    // 简单日志
    function addLog(title, details) {
      console.log(`[${new Date().toLocaleTimeString()}] ${title}: ${details}`);
    }

    // 设置权限和所有者（合并功能）
    async function setPermissions(encPath, currentMode, currentUser, currentGroup, currentUid, currentGid) {
      // 创建一个包含权限和所有者设置的模态框
      const path = decodeURIComponent(encPath);

      // 首先获取用户和组列表
      let users = [];
      let groups = [];

      try {
        const resp = await fetch(`/api/sftp/users-groups?server_id=${encodeURIComponent(currentServerId)}`);
        if (resp.ok) {
          const data = await resp.json();
          users = data.users;
          groups = data.groups;
        }
      } catch (e) {
        console.warn('无法获取用户和组列表:', e);
      }

      // 解析当前权限
      let mode = 0;
      if (typeof currentMode === 'string' && currentMode.startsWith('0o')) {
        mode = parseInt(currentMode.slice(2), 8);
      } else if (typeof currentMode === 'number') {
        mode = currentMode;
      }

      // 将权限转换为rwx格式
      const ownerRead = (mode & 0o400) !== 0;
      const ownerWrite = (mode & 0o200) !== 0;
      const ownerExecute = (mode & 0o100) !== 0;
      const groupRead = (mode & 0o040) !== 0;
      const groupWrite = (mode & 0o020) !== 0;
      const groupExecute = (mode & 0o010) !== 0;
      const publicRead = (mode & 0o004) !== 0;
      const publicWrite = (mode & 0o002) !== 0;
      const publicExecute = (mode & 0o001) !== 0;

      // 创建模态框HTML
      const modalHtml = `
        <div class="modal fade" id="permissionModal" tabindex="-1" aria-labelledby="permissionModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="permissionModalLabel">权限设置</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <p>文件名: ${path}</p>

                <div class="row">
                  <div class="col-6 mb-3">
                    <label for="newUser" class="form-label">用户</label>
                    <input type="text" class="form-control" id="newUser" placeholder="输入用户名或UID" value="${currentUser}">
                    <div class="form-text">当前: ${currentUser} (${currentUid})</div>
                    <div id="userSuggestions" class="dropdown-menu" style="display: none; max-height: 200px; overflow-y: auto;"></div>
                  </div>

                  <div class="col-6 mb-3">
                    <label for="newGroup" class="form-label">组</label>
                    <input type="text" class="form-control" id="newGroup" placeholder="输入组名或GID" value="${currentGroup}">
                    <div class="form-text">当前: ${currentGroup} (${currentGid})</div>
                    <div id="groupSuggestions" class="dropdown-menu" style="display: none; max-height: 200px; overflow-y: auto;"></div>
                  </div>
                </div>

                <div class="mb-3">
                  <h6>权限设置</h6>
                  <div class="row">
                    <div class="col-4">
                      <label class="form-label">所有者</label>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ownerRead" ${ownerRead ? 'checked' : ''}>
                        <label class="form-check-label" for="ownerRead">读取 (r)</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ownerWrite" ${ownerWrite ? 'checked' : ''}>
                        <label class="form-check-label" for="ownerWrite">写入 (w)</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ownerExecute" ${ownerExecute ? 'checked' : ''}>
                        <label class="form-check-label" for="ownerExecute">执行 (x)</label>
                      </div>
                    </div>

                    <div class="col-4">
                      <label class="form-label">用户组</label>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="groupRead" ${groupRead ? 'checked' : ''}>
                        <label class="form-check-label" for="groupRead">读取 (r)</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="groupWrite" ${groupWrite ? 'checked' : ''}>
                        <label class="form-check-label" for="groupWrite">写入 (w)</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="groupExecute" ${groupExecute ? 'checked' : ''}>
                        <label class="form-check-label" for="groupExecute">执行 (x)</label>
                      </div>
                    </div>

                    <div class="col-4">
                      <label class="form-label">公共组</label>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="publicRead" ${publicRead ? 'checked' : ''}>
                        <label class="form-check-label" for="publicRead">读取 (r)</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="publicWrite" ${publicWrite ? 'checked' : ''}>
                        <label class="form-check-label" for="publicWrite">写入 (w)</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="publicExecute" ${publicExecute ? 'checked' : ''}>
                        <label class="form-check-label" for="publicExecute">执行 (x)</label>
                      </div>
                    </div>
                  </div>

                  <div class="mt-3">
                    <label for="modeValue" class="form-label">权限值: <span id="modeValueDisplay">${mode.toString(8).padStart(3, '0')}</span></label>
                    <input type="text" class="form-control" id="modeValue" value="${mode.toString(8).padStart(3, '0')}" maxlength="3">
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirmPermission">确定</button>
              </div>
            </div>
          </div>
        </div>
      `;

      // 添加模态框到页面
      const modalContainer = document.createElement('div');
      modalContainer.innerHTML = modalHtml;
      document.body.appendChild(modalContainer);

      // 显示模态框
      const modal = new bootstrap.Modal(document.getElementById('permissionModal'));
      modal.show();

      // 获取DOM元素
      const userInputElement = document.getElementById('newUser');
      const groupInputElement = document.getElementById('newGroup');
      const userSuggestionsElement = document.getElementById('userSuggestions');
      const groupSuggestionsElement = document.getElementById('groupSuggestions');

      // 用户搜索功能
      userInputElement.addEventListener('input', function() {
        const value = this.value.toLowerCase();
        if (value.length > 0 && users.length > 0) {
          const filteredUsers = users.filter(user =>
            user.name.toLowerCase().includes(value) || user.uid.toString().includes(value)
          );

          if (filteredUsers.length > 0) {
            userSuggestionsElement.innerHTML = '';
            filteredUsers.forEach(user => {
              const item = document.createElement('a');
              item.className = 'dropdown-item';
              item.href = '#';
              item.textContent = `${user.name} (${user.uid})`;
              item.addEventListener('click', (e) => {
                e.preventDefault();
                userInputElement.value = user.name;
                userSuggestionsElement.style.display = 'none';
              });
              userSuggestionsElement.appendChild(item);
            });
            userSuggestionsElement.style.display = 'block';
          } else {
            userSuggestionsElement.style.display = 'none';
          }
        } else {
          userSuggestionsElement.style.display = 'none';
        }
      });

      // 组搜索功能
      groupInputElement.addEventListener('input', function() {
        const value = this.value.toLowerCase();
        if (value.length > 0 && groups.length > 0) {
          const filteredGroups = groups.filter(group =>
            group.name.toLowerCase().includes(value) || group.gid.toString().includes(value)
          );

          if (filteredGroups.length > 0) {
            groupSuggestionsElement.innerHTML = '';
            filteredGroups.forEach(group => {
              const item = document.createElement('a');
              item.className = 'dropdown-item';
              item.href = '#';
              item.textContent = `${group.name} (${group.gid})`;
              item.addEventListener('click', (e) => {
                e.preventDefault();
                groupInputElement.value = group.name;
                groupSuggestionsElement.style.display = 'none';
              });
              groupSuggestionsElement.appendChild(item);
            });
            groupSuggestionsElement.style.display = 'block';
          } else {
            groupSuggestionsElement.style.display = 'none';
          }
        } else {
          groupSuggestionsElement.style.display = 'none';
        }
      });

      // 点击其他地方隐藏下拉菜单
      document.addEventListener('click', function(e) {
        if (!userInputElement.contains(e.target) && !userSuggestionsElement.contains(e.target)) {
          userSuggestionsElement.style.display = 'none';
        }
        if (!groupInputElement.contains(e.target) && !groupSuggestionsElement.contains(e.target)) {
          groupSuggestionsElement.style.display = 'none';
        }
      });

      // 更新权限值显示
      function updateModeValue() {
        const owner = (document.getElementById('ownerRead').checked ? 4 : 0) +
                     (document.getElementById('ownerWrite').checked ? 2 : 0) +
                     (document.getElementById('ownerExecute').checked ? 1 : 0);
        const group = (document.getElementById('groupRead').checked ? 4 : 0) +
                     (document.getElementById('groupWrite').checked ? 2 : 0) +
                     (document.getElementById('groupExecute').checked ? 1 : 0);
        const public_ = (document.getElementById('publicRead').checked ? 4 : 0) +
                      (document.getElementById('publicWrite').checked ? 2 : 0) +
                      (document.getElementById('publicExecute').checked ? 1 : 0);
        const modeValue = `${owner}${group}${public_}`;
        document.getElementById('modeValue').value = modeValue;
        document.getElementById('modeValueDisplay').textContent = modeValue;
      }

      // 为所有复选框绑定事件
      const checkboxes = modalContainer.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', updateModeValue);
      });

      // 为权限值输入框绑定事件
      document.getElementById('modeValue').addEventListener('input', function() {
        const modeValue = this.value;
        if (modeValue.length === 3) {
          // 解析权限值并更新复选框
          const owner = parseInt(modeValue[0]);
          const group = parseInt(modeValue[1]);
          const public_ = parseInt(modeValue[2]);

          document.getElementById('ownerRead').checked = (owner & 4) !== 0;
          document.getElementById('ownerWrite').checked = (owner & 2) !== 0;
          document.getElementById('ownerExecute').checked = (owner & 1) !== 0;
          document.getElementById('groupRead').checked = (group & 4) !== 0;
          document.getElementById('groupWrite').checked = (group & 2) !== 0;
          document.getElementById('groupExecute').checked = (group & 1) !== 0;
          document.getElementById('publicRead').checked = (public_ & 4) !== 0;
          document.getElementById('publicWrite').checked = (public_ & 2) !== 0;
          document.getElementById('publicExecute').checked = (public_ & 1) !== 0;

          // 更新显示
          document.getElementById('modeValueDisplay').textContent = modeValue;
        }
      });

      // 初始化权限值
      updateModeValue();

      // 绑定确认按钮事件
      document.getElementById('confirmPermission').addEventListener('click', async function() {
        // 获取权限
        const modeValue = document.getElementById('modeValue').value;
        const mode = parseInt(modeValue, 8);

        if (isNaN(mode)) {
          alert('请输入有效的权限值');
          return;
        }

        // 获取所有者和组
        const userValue = document.getElementById('newUser').value;
        const groupValue = document.getElementById('newGroup').value;

        // 尝试从用户列表中找到匹配的用户
        let uid = currentUid;
        if (userValue !== currentUser) {
          const matchedUser = users.find(user =>
            user.name === userValue || user.uid.toString() === userValue
          );
          if (matchedUser) {
            uid = matchedUser.uid;
          } else {
            // 如果没有匹配的用户，尝试解析为数字
            const parsedUid = parseInt(userValue);
            if (!isNaN(parsedUid)) {
              uid = parsedUid;
            }
          }
        }

        // 尝试从组列表中找到匹配的组
        let gid = currentGid;
        if (groupValue !== currentGroup) {
          const matchedGroup = groups.find(group =>
            group.name === groupValue || group.gid.toString() === groupValue
          );
          if (matchedGroup) {
            gid = matchedGroup.gid;
          } else {
            // 如果没有匹配的组，尝试解析为数字
            const parsedGid = parseInt(groupValue);
            if (!isNaN(parsedGid)) {
              gid = parsedGid;
            }
          }
        }

        // 并行执行两个操作
        const chmodPromise = fetch('/api/sftp/chmod', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            server_id: currentServerId,
            path: path,
            mode: mode
          })
        });

        const chownPromise = fetch('/api/sftp/chown', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            server_id: currentServerId,
            path: path,
            uid: uid,
            gid: gid
          })
        });

        try {
          const [chmodResp, chownResp] = await Promise.all([chmodPromise, chownPromise]);

          let success = true;
          let errorMsg = '';

          if (!chmodResp.ok) {
            success = false;
            const errorData = await chmodResp.json().catch(() => ({error: '权限修改失败'}));
            errorMsg += `权限修改失败: ${errorData.error || ''}\n`;
          }

          if (!chownResp.ok) {
            success = false;
            const errorData = await chownResp.json().catch(() => ({error: '所有者修改失败'}));
            errorMsg += `所有者修改失败: ${errorData.error || ''}\n`;
          }

          if (success) {
            addLog('修改权限和所有者', `成功修改 ${path} 的权限为 ${modeValue}，所有者为 UID:${uid} GID:${gid}`);
            modal.hide();
            loadPath(currentPath);
          } else {
            alert(errorMsg);
          }
        } catch (e) {
          console.error(e);
          alert('修改过程中出现错误');
        }
      });

      // 模态框关闭后清理DOM
      document.getElementById('permissionModal').addEventListener('hidden.bs.modal', function () {
        document.body.removeChild(modalContainer);
      });
    }

    // 添加文件行点击选中效果
    document.addEventListener('click', (e) => {
      if (e.target.closest('.file-row')) {
        const row = e.target.closest('.file-row');
        if (row.classList.contains('selected')) {
          row.classList.remove('selected');
        } else {
          row.classList.add('selected');
        }
      }
    });
  </script>
</body>
</html>
